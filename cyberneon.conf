# CyberNeon - configuration read by install.sh (bash syntax).
# FAN MADE - inspired by Cyberpunk 2077 by CD PROJEKT RED. Cyberpunk 2077, Arasaka and all related
# names/logos/trademarks belong to CD PROJEKT S.A. (see NOTICE.md). Unofficial and non-commercial.
# Relative paths are relative to the repository folder.

# Image placed in the centre of the wallpaper sigil and used in place of the Budgie bird
# in the top bar (tinted neon red). Empty = original CyberNeon emblem.
LOGO="assets/logo/arasaka-logo.webp"

# Text under the centre emblem of the wallpaper.
LABEL="A R A S A K A"

# Operator name shown by the HUD. Empty = your user name in capitals.
HUD_LABEL=""

# Desktop HUD: "game" (Biomonitor, Radar with objective tracker, Chrono, reactive effects) or
# "classic" (the previous Conky panel and ShowTime clock).
HUD_STYLE="game"

# Panel layout with the game HUD, as in the KDE edition:
#   "bottom" = two floating pods at the top (logo + workspaces, tray + clock) and a floating dock with your apps
#   "left"   = the full top bar and the vertical dock on the left
# The classic layout always uses "left".
DOCK_POSITION="bottom"

# Wallpaper file name (created in ~/Pictures/Wallpapers).
WALLPAPER="cyberneon-arasaka-red.png"

# Opacity of Nemo (file manager) windows: 1.0 = opaque.
NEMO_OPACITY="0.90"

# Animated layer over the wallpaper (scan line, rotating arcs, blinking network, data packets, hex rain,
# glitches): "yes" or "no". LIVE_FPS = frames per second (15 ~ 5% of one CPU core; lower = lighter).
LIVE_WALLPAPER="yes"
LIVE_FPS="15"

# ---------------------------------------------------------------- reactive HUD (HUD_STYLE="game")
# Alert mode: over these limits (for 3 seconds) the Biomonitor frame pulses red, the wallpaper's intrusion alarm flashes
# and its glitches become frequent, until the load drops. "yes" or "no".
REACTIVE_HUD="yes"
ALERT_CPU=85          # percent
ALERT_RAM=85          # percent, page cache excluded
ALERT_TEMP=95         # degrees C, hottest of CPU and GPU

# The terminal in the wallpaper shows real data: network connections and recent journal activity.
# Addresses are replaced by tags that change at every boot and journal messages are never shown (only time, priority
# and program name), but program names stay visible. The login screen keeps the original text. "yes" or "no".
LIVE_TERMINAL="yes"
TRACE_MBPS=5          # MB/s of network traffic that prints "[WARN] trace program active"

# Threat radar (top right): programs with a real CPU or memory load are contacts (closer to the centre = heavier),
# programs moving data are arrows on the rim. Only program names are shown.
# Sentinel: the radar also flags intrusion events: a new USB device, a wrong password for sudo or the login/lock screen,
# an SSH login, a new port open to the network, a device seen for the first time on your network. It reads the login
# lines of the journal (your user must be in the "adm" group, as the first Ubuntu user is) but never shows them, and
# keeps only salted hashes of the devices it has seen (~/.local/share/cyberneon/radar-nodes). "yes" or "no".
SENTINEL="yes"

# Quickhack: click a contact on the radar to close that program (OVERLOAD, it can still save) or force it (FLATLINE),
# always after a confirmation. Only your own programs: the desktop session and other users' processes are protected.
# Only the contacts take clicks, the rest of the radar lets them through to the desktop. "yes" or "no".
QUICKHACK="yes"

# Quickhack OSD: volume and brightness as an upload bar at the bottom of the screen, replacing Budgie's OSD. "yes" or "no".
CYBER_OSD="yes"

# Synthetic sound theme: low chirp on notifications, warning on alert mode, jack-in when the session starts. "yes" or "no".
SOUND_FX="no"

# On battery below this percentage the wallpaper and the HUD stop animating (0 = never).
# The CELL CHARGE gauge appears by itself on machines with a battery; the active TUXEDO Control Center profile appears
# only where the Control Center is running.
LOW_POWER_PERCENT=20

# Launchers pinned in the left dock (desktop file names, comma separated; missing ones are skipped).
PINNED="budgie-control-center.desktop,nemo.desktop,firefox_firefox.desktop,com.gexperts.Tilix.desktop,libreoffice-calc.desktop"

# Fonts.
UI_FONT="Chakra Petch Medium 10"
DOC_FONT="Chakra Petch 10"
TITLE_FONT="Chakra Petch Bold 10"   # mutter: title height drives titlebar/button geometry (see README)
